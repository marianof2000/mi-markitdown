[project]
name = "mi-markitdown"
version = "0.1.0"
description = "Interfaz web para convertir documentos a Markdown con markitdown."

[paths]
input_dir = "input"
output_dir = "output"

[conversion]
default_extension = ".md"
default_engine = "markitdown"
allowed_engines = [
  "markitdown",
  "mineru",
]
overwrite = false
max_upload_mb = 50
allowed_extensions = [
  ".bmp",
  ".csv",
  ".docx",
  ".epub",
  ".html",
  ".htm",
  ".json",
  ".md",
  ".msg",
  ".jpeg",
  ".jpg",
  ".pdf",
  ".png",
  ".pptx",
  ".tif",
  ".tiff",
  ".txt",
  ".webp",
  ".xls",
  ".xlsx",
  ".xml",
  ".zip",
]

[logging]
level = "INFO"
file = "mi-markitdown.log"

[mineru]
backend = "pipeline"
timeout_seconds = 1800
