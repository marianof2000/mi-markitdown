[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-markitdown"
version = "0.1.0"
description = "Interfaz web para convertir documentos a Markdown con MarkItDown."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "markitdown[all]>=0.1.2",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0.0",
]
mineru = [
  "mineru[all]",
]

[project.scripts]
mi-markitdown = "app:main"

[tool.setuptools.packages.find]
include = ["mi_markitdown*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
